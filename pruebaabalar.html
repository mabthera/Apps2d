<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pruebaabalar · Encuesta ficticia</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif;
      color: #162938;
      background: #edf4f5;
    }

    body { margin: 0; }
    main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1rem; }
    h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.8rem); }
    p { line-height: 1.5; }
    iframe {
      display: block;
      width: 100%;
      height: 690px;
      box-sizing: border-box;
      border: 1px solid #b8cad1;
      border-radius: 1rem;
      background: white;
    }
    a { color: #00596a; text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Encuesta ficticia</h1>
    <p>Usa un alias inventado y escribe una actividad de ejemplo.</p>
    <iframe
      id="encuesta"
      title="Encuesta pruebaabalar en BoxAbalar"
      src="https://boxabalar.edu.xunta.gal/index.php/apps/forms/embed/fxe7emotNGkTJkiicpzrsnWE"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <p><a href="https://boxabalar.edu.xunta.gal/index.php/apps/forms/embed/fxe7emotNGkTJkiicpzrsnWE">Abrir la encuesta en BoxAbalar</a></p>
  </main>
  <script>
    const encuesta = document.getElementById('encuesta');
    const origen = new URL(encuesta.src).origin;

    window.addEventListener('message', (evento) => {
      if (evento.origin !== origen || evento.source !== encuesta.contentWindow) return;
      if (evento.data?.type !== 'resize-iframe') return;

      const altura = evento.data.payload?.height;
      if (Number.isFinite(altura) && altura > 0) {
        encuesta.style.height = `${Math.min(1400, Math.max(460, Math.ceil(altura) + 12))}px`;
      }
    });
  </script>
</body>
</html>
